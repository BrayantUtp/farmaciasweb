<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos - BoticaApp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f8f9fa;
            color: #212529;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 24px;
            color: #212529;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 16px;
        }
        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .order-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f8f9fa;
        }

        .order-id {
            font-size: 20px;
            font-weight: 700;
            color: #212529;
        }

        .order-date {
            font-size: 14px;
            color: #6c757d;
            margin-top: 4px;
        }

        .order-status {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-PENDIENTE {
            background: #fff3cd;
            color: #856404;
        }
        .status-PAGADO {
            background: #d4edda;
            color: #155724;
        }
        .status-ENTREGADO {
            background: #d1ecf1;
            color: #0c5460;
        }
        .status-CANCELADO {
            background: #f8d7da;
            color: #721c24;
        }

        .order-body {
            margin-bottom: 16px;
        }

        .order-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .order-icon {
            font-size: 32px;
        }

        .order-text {
            flex: 1;
        }

        .order-label {
            font-size: 13px;
            color: #6c757d;
        }

        .order-value {
            font-size: 15px;
            font-weight: 600;
            color: #212529;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 2px solid #f8f9fa;
        }

        .order-total {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
        }

        .order-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            border: none;
        }

        .btn-track {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-track:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-receipt {
            background: white;
            color: #28a745;
            border: 2px solid #28a745;
        }
        .btn-receipt:hover {
            background: #28a745;
            color: white;
        }

        .btn-pay {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            color: white;
        }
        .btn-pay:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.4);
        }

        .btn-back {
            display: inline-block;
            padding: 10px 20px;
            background: #f8f9fa;
            color: #212529;
            border-radius: 8px;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .btn-back:hover {
            background: #e9ecef;
        }

        @media (max-width: 768px) {
            .order-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .order-footer {
                flex-direction: column;
                gap: 16px;
                align-items: stretch;
            }
            .order-actions {
                flex-direction: column;
            }
            .btn {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a th:href="@{/}" class="btn-back">← Volver al Inicio</a>
        
        <h1>📦 Mis Pedidos</h1>

        <!-- Empty State -->
        <div class="empty-state" th:if="${pedidos == null or pedidos.isEmpty()}">
            <div class="empty-icon">📦</div>
            <h2>No tienes pedidos</h2>
            <p style="color: #6c757d; margin: 16px 0;">Aún no has realizado ningún pedido</p>
            <a th:href="@{/catalogo}" class="btn btn-track" style="margin-top: 16px;">Ir a Comprar</a>
        </div>

        <!-- Orders List -->
        <div class="orders-list" th:if="${pedidos != null and !pedidos.isEmpty()}">
            <div class="order-card" th:each="pedido : ${pedidos}">
                <!-- Order Header -->
                <div class="order-header">
                    <div>
                        <div class="order-id">
                            Pedido #<span th:text="${pedido.id}">1</span>
                        </div>
                        <div class="order-date">
                            <span th:text="${#temporals.format(pedido.creadoEn, 'dd/MM/yyyy HH:mm')}">29/11/2025 18:26</span>
                        </div>
                    </div>
                    <span class="order-status" 
                          th:classappend="${'status-' + pedido.estado.name()}">
                        <span th:text="${pedido.estado.name()}">PAGADO</span>
                    </span>
                </div>

                <!-- Order Body -->
                <div class="order-body">
                    <div class="order-info">
                        <div class="order-icon">💊</div>
                        <div class="order-text">
                            <div class="order-label">Productos</div>
                            <div class="order-value">Productos de farmacia</div>
                        </div>
                    </div>
                </div>

                <!-- Order Footer -->
                <div class="order-footer">
                    <div class="order-total">
                        S/ <span th:text="${#numbers.formatDecimal(pedido.total, 1, 2)}">15.80</span>
                    </div>
                    <div class="order-actions">
                        <!-- Botón Pagar (solo PENDIENTE) -->
                        <a th:if="${pedido.estado.name() == 'PENDIENTE'}" 
                           th:href="@{'/pago/' + ${pedido.id}}" 
                           class="btn btn-pay">
                            💳 Pagar Ahora
                        </a>
                        
                        <!-- Botón Seguimiento (solo PAGADO) -->
                        <a th:if="${pedido.estado.name() == 'PAGADO'}" 
                           th:href="@{'/pedidos/seguimiento/' + ${pedido.id}}" 
                           class="btn btn-track">
                            📍 Seguimiento
                        </a>
                        
                        <!-- ✅ CORREGIDO: Botón Ver Comprobante con href funcional -->
                        <a th:if="${pedido.estado.name() == 'PAGADO' or pedido.estado.name() == 'ENTREGADO'}" 
                           th:href="@{'/pedidos/comprobante/' + ${pedido.id}}"
                           class="btn btn-receipt">
                            📄 Ver Comprobante
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
