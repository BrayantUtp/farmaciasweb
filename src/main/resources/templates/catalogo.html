<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Catálogo | PeruBotica</title>
  <link rel="stylesheet" th:href="@{/catalogo.css}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

  <div class="container">
    <div class="space-between">
        <div>
            <h1 style="margin:0; font-size:1.8rem; letter-spacing:-0.5px; color:#0f172a;">Catálogo</h1>
            <span style="color:#64748b; font-size:0.95rem;">Busca y agrega productos a tu pedido</span>
        </div>
        <a th:href="@{/}" class="btn ghost">
            <span>← Volver al Inicio</span>
        </a>
    </div>

    <div class="search-card">
        <form method="get" class="search-row">
            <input type="text" name="q" th:value="${q}" placeholder="Escribe el nombre del medicamento, categoría..." autocomplete="off"/>
            <button class="btn primary">Buscar</button>
            <a class="btn excel-btn" th:href="@{/catalogo/export}" title="Descargar Excel">
                <span>Excel</span>
            </a>
        </form>
    </div>

    <div class="cards-grid" th:if="${!#lists.isEmpty(productos)}">
        
        <div th:each="p : ${productos}" class="card product-card">
            
            <div class="image-placeholder" th:attr="data-cat=${p.categoria}">
                <span th:text="${p.nombre != null ? p.nombre.substring(0,1).toUpperCase() : 'F'}"></span>
            </div>

            <div class="product-main">
                <div class="product-header">
                    <h3 th:text="${p.nombre}">Nombre Producto</h3>
                    <span class="badge" th:text="${p.categoria}">Categoría</span>
                </div>

                <form th:action="@{/cart/add}" method="post" class="add-to-cart-form">
                    <input type="hidden" name="productoId" th:value="${p.id}" />
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    
                    <input type="number" name="cantidad" value="1" min="1" class="qty-input" aria-label="Cantidad"/>
                    <button type="submit" class="btn primary btn-add">Agregar</button>
                </form>
            </div>

            <div class="product-right">
                
                <div class="price-tag">
                    <span class="price-symbol">S/</span><span th:text="${bestPriceMap[p.id]}">0.00</span>
                </div>

                <div class="stock-section" style="width: 100%;">
                    <div class="stock-label">Disponibilidad</div>
                    
                    <ul class="stock-list">
                        <li class="stock-item" 
                            th:if="${stocksMap[p.id] != null}" 
                            th:each="s : ${stocksMap[p.id]}">
                            
                            <span class="botica-name" th:text="${s.botica.nombre}" title="${s.botica.nombre}">Botica</span>
                            
                            <div style="display:flex; align-items:center;">
                                <span class="stock-badge" th:text="${s.cantidad + ' un.'}">10 un.</span>
                                <span class="mini-price" th:text="'S/' + ${#numbers.formatDecimal(s.precio, 1, 2)}">5.00</span>
                            </div>
                        </li>
                    </ul>

                    <div th:if="${stocksMap[p.id] == null or #lists.isEmpty(stocksMap[p.id])}" 
                         style="text-align:right; font-size:0.8rem; color:#ef4444; margin-top:4px;">
                        Agotado
                    </div>
                </div>
            </div>

        </div> </div>

    <div th:if="${#lists.isEmpty(productos)}" style="text-align:center; padding:60px 20px; color:#94a3b8;">
        <div style="font-size:3rem; margin-bottom:10px;">🔍</div>
        <h3 style="color:#475569;">No encontramos productos</h3>
        <p>Intenta buscando con otro término.</p>
    </div>

    <div class="footer">
        &copy; 2024 PeruBotica - Sistema de Gestión Farmacéutica
    </div>
</div>
<div id="toast-container" style="position:fixed; right:20px; bottom:20px; z-index:99; display:flex; flex-direction:column; gap:10px;"></div>
<script>
    document.addEventListener('DOMContentLoaded', function(){
      const forms = document.querySelectorAll('.add-to-cart-form');
      forms.forEach(form => {
        form.addEventListener('submit', async function(e){
          e.preventDefault();
          const btn = form.querySelector('button[type="submit"]');
          const originalText = btn.innerText;
          btn.disabled = true; btn.style.opacity = "0.7"; btn.innerText = "...";
          
          const fd = new FormData(form);
          try{
            const res = await fetch(form.action, { method: 'POST', body: fd, credentials: 'same-origin' });
            if(res.redirected){ window.location = res.url; return; }
            if(!res.ok){ throw new Error('Error'); }
            showToast('Agregado al carrito', 'success');
            btn.innerText = "✔";
            setTimeout(() => { btn.innerText = originalText; btn.style.opacity = "1"; }, 1500);
          }catch(err){
            console.error(err);
            showToast('Error al agregar', 'error');
            btn.innerText = originalText;
          }finally{ btn.disabled = false; }
        });
      });
    });

    function showToast(message, type){
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = 'toast ' + (type === 'success' ? 'toast-success' : 'toast-error');
      t.innerHTML = `<span style="font-size:1.2rem">${type === 'success' ? '✓' : '✕'}</span> <span>${message}</span>`;
      c.appendChild(t);
      setTimeout(()=>{ t.style.opacity = '0'; t.style.transition = 'opacity 0.5s'; setTimeout(()=>t.remove(), 500); }, 3000);
    }
</script>
</body>
</html>
