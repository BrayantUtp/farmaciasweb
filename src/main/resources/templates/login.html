<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Login</title><link rel="stylesheet" th:href="@{/styles.css}"></head>
<body>
<h1>Ingresar</h1>
<form method="post" th:action="@{/login}" class="column">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
  <label>Correo</label><input type="text" name="username" />
  <label>Contraseña</label><input type="password" name="password" />
  <button type="submit">Entrar</button>
  <div th:if="${param.error}" style="color:#c00">Credenciales inválidas</div>
  <div th:if="${param.registered}" style="color:#090">Registro exitoso. Ingresa.</div>
</form>
<p><a th:href="@{/register}">Registrarme</a></p>
</body></html>
