<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - BoticaApp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-container { width: 100%; max-width: 480px; }
        .register-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .logo-section { text-align: center; margin-bottom: 32px; }
        .logo { font-size: 48px; margin-bottom: 8px; }
        .logo-text {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { font-size: 14px; color: #6c757d; margin-top: 8px; }
        h1 { font-size: 24px; font-weight: 700; color: #212529; margin-bottom: 8px; text-align: center; }
        .welcome-text { font-size: 14px; color: #6c757d; text-align: center; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 600; color: #495057; margin-bottom: 8px; }
        .input-wrapper { position: relative; }
        .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 18px; color: #9ca3af; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        input.error { border-color: #dc3545; }
        input::placeholder { color: #9ca3af; }
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #9ca3af;
            padding: 4px;
        }
        .password-toggle:hover { color: #667eea; }
        .error-message { color: #dc3545; font-size: 13px; margin-top: 6px; display: flex; align-items: center; gap: 4px; }
        .btn-register {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 24px;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }
        .terms {
            font-size: 13px;
            color: #6c757d;
            text-align: center;
            margin-top: 16px;
            line-height: 1.5;
        }
        .terms a { color: #667eea; text-decoration: none; }
        .terms a:hover { text-decoration: underline; }
        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #6c757d;
        }
        .login-link a { color: #667eea; font-weight: 600; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
        .alert { padding: 14px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .alert-error { background: #fee; color: #c00; border-left: 4px solid #dc3545; }
        .back-to-home { text-align: center; margin-top: 24px; }
        .back-to-home a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .back-to-home a:hover { background: rgba(255, 255, 255, 0.1); }
        @media (max-width: 480px) {
            .register-card { padding: 32px 24px; }
            .logo { font-size: 40px; }
            .logo-text { font-size: 24px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="logo-section">
                <div class="logo">💊</div>
                <div class="logo-text">BoticaApp</div>
                <p class="subtitle">Tu farmacia de confianza</p>
            </div>

            <h1>Crear Cuenta</h1>
            <p class="welcome-text">Regístrate para empezar a comprar</p>

            <div th:if="${#fields.hasErrors('global')}" class="alert alert-error">
                <span>⚠️</span>
                <span th:errors="*{global}">Error general</span>
            </div>

            <form method="post" th:action="@{/register}" th:object="${form}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                
                <div class="form-group">
                    <label for="nombres">Nombre Completo</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="nombres" th:field="*{nombres}"
                               th:class="${#fields.hasErrors('nombres')} ? 'error' : ''"
                               placeholder="Juan Pérez" required autofocus>
                    </div>
                    <div th:if="${#fields.hasErrors('nombres')}" class="error-message">
                        ⚠️ <span th:errors="*{nombres}">Error</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <span class="input-icon">📧</span>
                        <input type="email" id="email" th:field="*{email}"
                               th:class="${#fields.hasErrors('email')} ? 'error' : ''"
                               placeholder="tu@email.com" required>
                    </div>
                    <div th:if="${#fields.hasErrors('email')}" class="error-message">
                        ⚠️ <span th:errors="*{email}">Error</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" th:field="*{password}"
                               th:class="${#fields.hasErrors('password')} ? 'error' : ''"
                               placeholder="••••••••" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">👁️</button>
                    </div>
                    <div th:if="${#fields.hasErrors('password')}" class="error-message">
                        ⚠️ <span th:errors="*{password}">Error</span>
                    </div>
                </div>

                <button type="submit" class="btn-register">Crear Cuenta</button>

                <p class="terms">
                    Al registrarte, aceptas nuestros 
                    <a href="#">Términos y Condiciones</a> y 
                    <a href="#">Política de Privacidad</a>
                </p>
            </form>

            <div class="login-link">
                ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a>
            </div>
        </div>

        <div class="back-to-home">
            <a th:href="@{/}">← Volver al inicio</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.password-toggle');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }
    </script>
</body>
