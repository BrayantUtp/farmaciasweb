<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <style>
    /* --- RESET & BASE --- */
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #f8fafc; color: #1e293b; min-height: 100vh; display: grid; place-items: center; }
    .form-wrap { width: min(420px, 96vw); margin: 0 auto; }
    form.column { background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(44, 62, 80, 0.13); padding: 38px 32px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 18px; }
    h1 { text-align: center; font-size: 2rem; font-weight: 700; color: #2d3748; margin-bottom: 18px; }
    label { font-weight: 600; color: #374151; }
    input[type="email"], input[type="text"], input[type="password"] { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; background: #f3f6fa; font-size: 1rem; transition: border-color 0.2s; }
    input:focus { border-color: #4f46e5; background: #fff; outline: none; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 0.98rem; cursor: pointer; transition: all 0.2s; gap: 8px; text-decoration: none; }
    .btn.primary { background: #4f46e5; color: #fff; box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2); }
    .btn.primary:hover { background: #4338ca; transform: translateY(-1px); }
    .btn.ghost { background: #fff; border-color: #cbd5e1; color: #475569; }
    .btn.ghost:hover { background: #f1f5f9; border-color: #94a3b8; }
    .error { color: #b91c1c; background: #fee2e2; border-radius: 8px; padding: 6px 10px; font-size: 0.98rem; margin-bottom: 4px; }
    @media (max-width: 600px) { .form-wrap { width: 99vw; } form.column { padding: 22px 8px; } }
  </style>
</head>
<body>
<h1>Registro</h1>
<form th:object="${form}" method="post" class="column">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
  <label>Correo</label><input type="email" th:field="*{email}"/>
  <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</div>
  <label>Nombres</label><input type="text" th:field="*{nombres}"/>
  <div class="error" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}">Error</div>
  <label>Contraseña</label><input type="password" th:field="*{password}"/>
  <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</div>
  <button class="btn primary">Crear cuenta</button>
</form>
</body></html>
