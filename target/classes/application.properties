# ============================================
# CONFIGURACIÓN DE BASE DE DATOS (MySQL)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/botica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================
# OPCIONAL: LOGGING Y DEBUG
# ============================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# 14.2 MONITOREO: SPRING BOOT ACTUATOR
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,loggers,httpexchanges,env,threaddump,heapdump
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.tags.application=BoticaApp
management.metrics.tags.environment=production
management.httpexchanges.recording.include=REQUEST_HEADERS,RESPONSE_HEADERS,COOKIE_HEADERS
info.app.name=BoticaApp Web MVC
info.app.description=Sistema de Gestión Farmacéutica - Avance 3
info.app.version=0.0.1-SNAPSHOT
info.app.java.version=17
info.company.name=Universidad Tecnológica del Perú (UTP)
