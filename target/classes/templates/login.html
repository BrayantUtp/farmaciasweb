<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Ingresar | PeruBotica</title>
  <style>
    /* --- RESET & BASE --- */
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body.auth-bg { margin: 0; background: #f8fafc; color: #1e293b; min-height: 100vh; display: grid; place-items: center; }
    .auth-wrap { width: min(420px, 96vw); margin: 0 auto; }
    .card.auth-card { background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(44, 62, 80, 0.13); padding: 38px 32px; border: 1px solid #e2e8f0; }
    .auth-brand { text-align: center; margin-bottom: 22px; }
    .logo-circle { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6 60%, #6366f1 100%); color: #fff; font-weight: 700; font-size: 26px; display: grid; place-items: center; margin: 0 auto 12px auto; box-shadow: 0 4px 16px rgba(59, 130, 246, 0.18); }
    .auth-brand h1 { margin: 0 0 6px; font-size: 24px; font-weight: 700; color: #2d3748; }
    .muted { color: #6b7280; font-size: 1rem; }
    .form-grid { display: grid; gap: 14px; margin-top: 14px; }
    .form-grid label { font-weight: 600; color: #374151; }
    .form-grid input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; background: #f3f6fa; font-size: 1rem; transition: border-color 0.2s; }
    .form-grid input:focus { border-color: #4f46e5; background: #fff; outline: none; }
    .space-between { display: flex; justify-content: space-between; align-items: center; }
    .btn-link { background: none; border: none; color: #4f46e5; font-weight: 600; cursor: pointer; text-decoration: underline; font-size: 0.98rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 0.98rem; cursor: pointer; transition: all 0.2s; gap: 8px; text-decoration: none; }
    .btn.primary { background: #4f46e5; color: #fff; box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2); }
    .btn.primary:hover { background: #4338ca; transform: translateY(-1px); }
    .btn.ghost { background: #fff; border-color: #cbd5e1; color: #475569; }
    .btn.ghost:hover { background: #f1f5f9; border-color: #94a3b8; }
    .alert { border-radius: 10px; padding: 10px 12px; font-weight: 600; margin: 8px 0 6px; border: 1px solid transparent; }
    .alert.error { color: #b91c1c; background: #fee2e2; border-color: #fecaca; }
    .alert.success { color: #065f46; background: #d1fae5; border-color: #a7f3d0; }
    .link { color: #4f46e5; text-decoration: underline; font-weight: 600; }
    .center { text-align: center; }
    .mt-2 { margin-top: 14px; }
    @media (max-width: 600px) { .auth-wrap { width: 99vw; } .card.auth-card { padding: 22px 8px; } }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body class="auth-bg">
  <main class="auth-wrap">
    <section class="card auth-card">
      <div class="auth-brand">
        <!-- coloca aquí tu logo si tienes -->
        <div class="logo-circle">B</div>
        <h1>Bienvenido</h1>
        <p class="muted">Inicia sesión para continuar</p>
      </div>

      <!-- alertas -->
      <div class="alert error" th:if="${param.error}">
        Credenciales inválidas. Inténtalo nuevamente.
      </div>
      <div class="alert success" th:if="${param.registered}">
        ¡Tu cuenta fue creada! Ya puedes ingresar.
      </div>

      <form method="post" th:action="@{/login}" class="form-grid">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <label for="username">Correo</label>
        <input id="username" name="username" type="email" placeholder="tucorreo@utp.pe" required autocomplete="username" />

        <label for="password" class="space-between">
          Contraseña
          <button type="button" class="btn-link" id="togglePwd">Mostrar</button>
        </label>
        <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password" />

        <button class="btn primary" type="submit">Entrar</button>
      </form>

      <p class="muted center mt-2">
        ¿No tienes cuenta?
        <a th:href="@{/register}" class="link">Registrarme</a>
      </p>
    </section>
  </main>

  <script>
    // Mostrar/ocultar contraseña
    const pwd = document.getElementById('password');
    const tog = document.getElementById('togglePwd');
    if (tog && pwd) {
      tog.addEventListener('click', () => {
        const show = pwd.type === 'password';
        pwd.type = show ? 'text' : 'password';
        tog.textContent = show ? 'Ocultar' : 'Mostrar';
      });
    }
  </script>
</body>
</html>
