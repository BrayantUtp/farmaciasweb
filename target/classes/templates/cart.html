<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head><meta charset="UTF-8"><title>Carrito</title><link rel="stylesheet" th:href="@{/cart.css}"></head>
<body>
  <div class="container">
    <h1>Carrito de compras</h1>

    <!-- Si hay productos -->
    <div th:if="${!#lists.isEmpty(items)}">
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cant.</th>
            <th>Precio</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="i: ${items}">
            <td th:text="${i.producto.nombre}">Producto</td>
            <td th:text="${i.cantidad}">1</td>
            <td>
              S/ <span th:text="${#numbers.formatDecimal(i.producto.precio * i.cantidad, 1, 'COMMA', 2, 'POINT')}">0.00</span>
            </td>
            <td>
              <form th:action="@{'/cart/delete/' + ${i.id}}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn-delete">Eliminar</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Resumen -->
      <div class="resumen">
        <div class="fila">
          <span>Productos en el carrito:</span>
          <span th:text="${#lists.size(items)} + ' unidades'">0 unidades</span>
        </div>
        <div class="fila total">
          <span>Total:</span>
          <span>
           S/ <span th:text="${#numbers.formatDecimal(totalCarrito, 1, 'COMMA', 2, 'POINT')}">0.00</span>
          </span>
        </div>
      </div>

      <!-- Botones -->
      <div class="acciones">
        <a th:href="@{/catalogo}" class="volver">← Volver al catálogo</a>
        <form th:action="@{/cart/checkout}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button class="btn-finalizar">Finalizar compra</button>
        </form>
      </div>
    </div>

    <!-- Si el carrito está vacío -->
    <div th:if="${#lists.isEmpty(items)}">
      <p class="mensaje-vacio">No hay productos en el carrito.</p>
      <div class="acciones" style="justify-content: center;">
        <a th:href="@{/catalogo}" class="volver">← Volver al catálogo</a>
      </div>
    </div>

  </div>
</body>
</html>
