<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<h1>Carrito</h1>
<table th:if="${!#lists.isEmpty(items)}" class="table">
  <thead><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th></th></tr></thead>
  <tbody>
    <tr th:each="i: ${items}">
      <td th:text="${i.producto.nombre}">Nombre</td>
      <td th:text="${i.cantidad}">1</td>
      <td th:text="${i.producto.precio}">0.00</td>
      <td>
        <form th:action="@{'/cart/delete/' + ${i.id}}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button>Quitar</button>
        </form>
      </td>
    </tr>
  </tbody>
</table>
<form th:if="${!#lists.isEmpty(items)}" th:action="@{/cart/checkout}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
  <button>Finalizar compra</button>
</form>
<p><a th:href="@{/catalogo}">Volver al catálogo</a></p>
</body></html>
