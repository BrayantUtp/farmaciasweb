<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Carrito</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 25px;
      color: #222;
      font-weight: 600;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      font-weight: 600;
      color: #555;
      border-bottom: 2px solid #eee;
      padding: 12px 0;
    }

    td {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
    }

    .btn-delete {
      background: none;
      color: #b30000;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn-delete:hover {
      color: #ff0000;
      text-decoration: underline;
    }

    .resumen {
      width: 100%;
      background-color: #f9f9f9;
      border: 1px solid #eaeaea;
      border-radius: 12px;
      margin-top: 30px;
      padding: 25px 30px;
      box-sizing: border-box;
    }

    .resumen .fila {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .resumen .fila.total {
      font-weight: 700;
      font-size: 18px;
      border-top: 2px solid #ddd;
      padding-top: 10px;
      margin-top: 10px;
    }

    .acciones {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .volver {
      text-decoration: none;
      color: #0043ce;
      font-weight: 500;
      transition: 0.3s;
    }

    .volver:hover {
      text-decoration: underline;
    }

    .btn-finalizar {
      background-color: #232f3e;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 14px 40px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-finalizar:hover {
      background-color: #1a232e;
    }

    .mensaje-vacio {
      text-align: center;
      color: #555;
      margin: 40px 0 20px;
      font-size: 16px;
    }

    /* Responsividad */
    @media (max-width: 768px) {
      .container {
        padding: 20px;
        margin: 20px;
      }

      table, th, td {
        font-size: 14px;
      }

      .resumen {
        padding: 15px;
      }

      .btn-finalizar {
        width: 100%;
        padding: 12px 0;
      }

      .acciones {
        flex-direction: column;
        align-items: stretch;
      }

      .volver {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Carrito de compras</h1>

    <!-- Si hay productos -->
    <div th:if="${!#lists.isEmpty(items)}">
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cant.</th>
            <th>Precio</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="i: ${items}">
            <td th:text="${i.producto.nombre}">Producto</td>
            <td th:text="${i.cantidad}">1</td>
            <td>
              S/ <span th:text="${#numbers.formatDecimal(i.producto.precio * i.cantidad, 1, 'COMMA', 2, 'POINT')}">0.00</span>
            </td>
            <td>
              <form th:action="@{'/cart/delete/' + ${i.id}}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn-delete">Eliminar</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Resumen -->
      <div class="resumen">
        <div class="fila">
          <span>Productos en el carrito:</span>
          <span th:text="${#lists.size(items)} + ' unidades'">0 unidades</span>
        </div>
        <div class="fila total">
          <span>Total:</span>
          <span>
           S/ <span th:text="${#numbers.formatDecimal(totalCarrito, 1, 'COMMA', 2, 'POINT')}">0.00</span>
          </span>
        </div>
      </div>

      <!-- Botones -->
      <div class="acciones">
        <a th:href="@{/catalogo}" class="volver">← Volver al catálogo</a>
        <form th:action="@{/cart/checkout}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button class="btn-finalizar">Finalizar compra</button>
        </form>
      </div>
    </div>

    <!-- Si el carrito está vacío -->
    <div th:if="${#lists.isEmpty(items)}">
      <p class="mensaje-vacio">No hay productos en el carrito.</p>
      <div class="acciones" style="justify-content: center;">
        <a th:href="@{/catalogo}" class="volver">← Volver al catálogo</a>
      </div>
    </div>

  </div>
</body>
</html>
