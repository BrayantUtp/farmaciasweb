<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Pedidos</title><link rel="stylesheet" th:href="@{/styles.css}"></head>
<body>
<h1>Mis pedidos</h1>
<table class="table">
  <thead><tr><th>ID</th><th>Fecha</th><th>Estado</th><th>Total</th></tr></thead>
  <tbody>
    <tr th:each="p: ${pedidos}">
      <td th:text="${p.id}">1</td>
      <td th:text="${#temporals.format(p.creadoEn, 'dd/MM/yyyy HH:mm')}">-</td>
      <td th:text="${p.estado}">PENDIENTE</td>
      <td th:text="${p.total}">0.00</td>
    </tr>
  </tbody>
</table>
<p><a th:href="@{/}">Inicio</a></p>
</body></html>
