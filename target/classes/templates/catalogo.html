<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        /* --- RESET & BASE --- */
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { margin: 0; background: #f8fafc; color: #1e293b; }
        .container { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
        .space-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; gap: 8px; text-decoration: none; }
        .btn.primary { background: #4f46e5; color: #fff; box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2); }
        .btn.primary:hover { background: #4338ca; transform: translateY(-1px); }
        .btn.ghost { background: #fff; border-color: #cbd5e1; color: #475569; }
        .btn.ghost:hover { background: #f1f5f9; border-color: #94a3b8; }
        .excel-btn { background: #ecfdf5; color: #059669; border-color: #d1fae5; }
        .excel-btn:hover { background: #d1fae5; border-color: #10b981; }
        .search-card { background: #fff; padding: 12px; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); margin-bottom: 30px; border: 1px solid #e2e8f0; }
        .search-row { display: flex; gap: 10px; width: 100%; }
        .search-row input { flex: 1; padding: 10px 16px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; font-size: 0.95rem; }
        .search-row input:focus { border-color: #4f46e5; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 24px; }
        .card.product-card { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 24px; display: flex; gap: 20px; align-items: flex-start; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); transition: transform 0.2s, box-shadow 0.2s; position: relative; overflow: hidden; }
        .card.product-card:hover { transform: translateY(-3px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.08); border-color: #cbd5e1; }
        .image-placeholder { width: 64px; height: 64px; border-radius: 12px; flex-shrink: 0; display: grid; place-items: center; font-weight: 800; font-size: 26px; background: linear-gradient(135deg, #e0e7ff 0%, #eff6ff 100%); color: #4338ca; }
        .product-main { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
        .product-header h3 { margin: 0 0 6px 0; font-size: 1.15rem; color: #0f172a; line-height: 1.3; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; background: #f1f5f9; color: #64748b; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .add-to-cart-form { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .qty-input { width: 60px; padding: 9px; text-align: center; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: 600; outline: none; font-size: 0.95rem; }
        .qty-input:focus { border-color: #4f46e5; }
        .product-right { width: 220px; flex-shrink: 0; display: flex; flex-direction: column; border-left: 1px dashed #e2e8f0; padding-left: 20px; height: 100%; justify-content: flex-start; }
        .price-tag { font-size: 1.6rem; font-weight: 800; color: #0f172a; text-align: right; margin-bottom: 16px; letter-spacing: -0.5px; }
        .price-symbol { font-size: 1rem; color: #64748b; font-weight: 600; margin-right: 2px; }
        .stock-section { font-size: 0.85rem; }
        .stock-label { font-size: 0.7rem; font-weight: 700; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; text-align: right; }
        .stock-list { list-style: none; padding: 0; margin: 0; }
        .stock-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #f1f5f9; }
        .stock-item:last-child { border-bottom: none; }
        .botica-name { font-weight: 500; color: #475569; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 90px; }
        .stock-badge { background: #dcfce7; color: #166534; padding: 1px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin: 0 6px; }
        .mini-price { font-weight: 700; color: #0f172a; }
        .footer { text-align: center; margin-top: 50px; color: #94a3b8; font-size: 0.9rem; border-top: 1px solid #e2e8f0; padding-top: 20px;}
        .toast { background: #fff; padding: 12px 16px; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 10px; border-left: 4px solid; }
        .toast-success { border-color: #10b981; color: #064e3b; }
        .toast-error { border-color: #ef4444; color: #7f1d1d; }
        @media (max-width: 768px) { .cards-grid { grid-template-columns: 1fr; } .card.product-card { flex-direction: column; gap: 16px; } .product-right { width: 100%; border-left: none; border-top: 1px dashed #e2e8f0; padding-left: 0; padding-top: 16px; flex-direction: row; justify-content: space-between; align-items: center; } .price-tag { margin-bottom: 0; order: 2; } .stock-section { flex: 1; order: 1; } .stock-label { text-align: left; } }
    </style>
    <link rel="stylesheet" th:href="@{/catalogo.css}">
  <meta charset="UTF-8">
  <title>Catálogo | PeruBotica</title>
  <link rel="stylesheet" th:href="@{/catalogo.css}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

  <div class="container">
    <div class="space-between">
        <div>
            <h1 style="margin:0; font-size:1.8rem; letter-spacing:-0.5px; color:#0f172a;">Catálogo</h1>
            <span style="color:#64748b; font-size:0.95rem;">Busca y agrega productos a tu pedido</span>
        </div>
        <a th:href="@{/}" class="btn ghost">
            <span>← Volver al Inicio</span>
        </a>
    </div>

    <div class="search-card">
        <form method="get" class="search-row">
            <input type="text" name="q" th:value="${q}" placeholder="Escribe el nombre del medicamento, categoría..." autocomplete="off"/>
            <button class="btn primary">Buscar</button>
            <a class="btn excel-btn" th:href="@{/catalogo/export}" title="Descargar Excel">
                <span>Excel</span>
            </a>
        </form>
    </div>

    <div class="cards-grid" th:if="${!#lists.isEmpty(productos)}">
        
        <div th:each="p : ${productos}" class="card product-card">
            
            <div class="image-placeholder" th:attr="data-cat=${p.categoria}">
                <span th:text="${p.nombre != null ? p.nombre.substring(0,1).toUpperCase() : 'F'}"></span>
            </div>

            <div class="product-main">
                <div class="product-header">
                    <h3 th:text="${p.nombre}">Nombre Producto</h3>
                    <span class="badge" th:text="${p.categoria}">Categoría</span>
                </div>

                <form th:action="@{/cart/add}" method="post" class="add-to-cart-form">
                    <input type="hidden" name="productoId" th:value="${p.id}" />
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    
                    <input type="number" name="cantidad" value="1" min="1" class="qty-input" aria-label="Cantidad"/>
                    <button type="submit" class="btn primary btn-add">Agregar</button>
                </form>
            </div>

            <div class="product-right">
                
                <div class="price-tag">
                    <span class="price-symbol">S/</span><span th:text="${bestPriceMap[p.id]}">0.00</span>
                </div>

                <div class="stock-section" style="width: 100%;">
                    <div class="stock-label">Disponibilidad</div>
                    
                    <ul class="stock-list">
                        <li class="stock-item" 
                            th:if="${stocksMap[p.id] != null}" 
                            th:each="s : ${stocksMap[p.id]}">
                            
                            <span class="botica-name" th:text="${s.botica.nombre}" title="${s.botica.nombre}">Botica</span>
                            
                            <div style="display:flex; align-items:center;">
                                <span class="stock-badge" th:text="${s.cantidad + ' un.'}">10 un.</span>
                                <span class="mini-price" th:text="'S/' + ${#numbers.formatDecimal(s.precio, 1, 2)}">5.00</span>
                            </div>
                        </li>
                    </ul>

                    <div th:if="${stocksMap[p.id] == null or #lists.isEmpty(stocksMap[p.id])}" 
                         style="text-align:right; font-size:0.8rem; color:#ef4444; margin-top:4px;">
                        Agotado
                    </div>
                </div>
            </div>

        </div> </div>

    <div th:if="${#lists.isEmpty(productos)}" style="text-align:center; padding:60px 20px; color:#94a3b8;">
        <div style="font-size:3rem; margin-bottom:10px;">🔍</div>
        <h3 style="color:#475569;">No encontramos productos</h3>
        <p>Intenta buscando con otro término.</p>
    </div>

    <div class="footer">
        &copy; 2024 PeruBotica - Sistema de Gestión Farmacéutica
    </div>
</div>
<div id="toast-container" style="position:fixed; right:20px; bottom:20px; z-index:99; display:flex; flex-direction:column; gap:10px;"></div>
<script>
    document.addEventListener('DOMContentLoaded', function(){
      const forms = document.querySelectorAll('.add-to-cart-form');
      forms.forEach(form => {
        form.addEventListener('submit', async function(e){
          e.preventDefault();
          const btn = form.querySelector('button[type="submit"]');
          const originalText = btn.innerText;
          btn.disabled = true; btn.style.opacity = "0.7"; btn.innerText = "...";
          
          const fd = new FormData(form);
          try{
            const res = await fetch(form.action, { method: 'POST', body: fd, credentials: 'same-origin' });
            if(res.redirected){ window.location = res.url; return; }
            if(!res.ok){ throw new Error('Error'); }
            showToast('Agregado al carrito', 'success');
            btn.innerText = "✔";
            setTimeout(() => { btn.innerText = originalText; btn.style.opacity = "1"; }, 1500);
          }catch(err){
            console.error(err);
            showToast('Error al agregar', 'error');
            btn.innerText = originalText;
          }finally{ btn.disabled = false; }
        });
      });
    });

    function showToast(message, type){
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = 'toast ' + (type === 'success' ? 'toast-success' : 'toast-error');
      t.innerHTML = `<span style="font-size:1.2rem">${type === 'success' ? '✓' : '✕'}</span> <span>${message}</span>`;
      c.appendChild(t);
      setTimeout(()=>{ t.style.opacity = '0'; t.style.transition = 'opacity 0.5s'; setTimeout(()=>t.remove(), 500); }, 3000);
    }
</script>
</body>
</html>
